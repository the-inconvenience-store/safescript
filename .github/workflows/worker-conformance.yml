name: Worker conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  worker-conformance:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-node-22, runner: ubuntu-24.04, node: 22 }
          - { name: linux-x64-node-24, runner: ubuntu-24.04, node: 24 }
          - { name: linux-arm64-node-22, runner: ubuntu-24.04-arm, node: 22 }
          - { name: linux-arm64-node-24, runner: ubuntu-24.04-arm, node: 24 }
          - { name: macos-x64-node-22, runner: macos-15-intel, node: 22 }
          - { name: macos-x64-node-24, runner: macos-15-intel, node: 24 }
          - { name: macos-arm64-node-22, runner: macos-15, node: 22 }
          - { name: macos-arm64-node-24, runner: macos-15, node: 24 }
          - { name: windows-x64-node-22, runner: windows-2025, node: 22 }
          - { name: windows-x64-node-24, runner: windows-2025, node: 24 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Select the matrix Node executable and built worker
        run: node conformance/scripts/configure-process-adapter.mjs
      - run: bun test conformance/src/index.test.ts conformance/src/worker-protocol-spec.test.ts
      - run: node conformance/scripts/write-platform-evidence.mjs
        env:
          EVIDENCE_FILE: conformance/evidence/platform/${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: worker-conformance-${{ matrix.name }}
          path: conformance/evidence/platform/${{ matrix.name }}.json
          if-no-files-found: error
